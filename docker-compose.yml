version: "3.8"
services:
  api:
    build: ./api
    environment:
      - API_KEY=changeme123
    ports:
      - "8000:8000"
    volumes:
      - ./model:/app/../model:ro
  web:
    build: ./web
    environment:
      - API_URL=http://api:8000
      - API_KEY=changeme123
    ports:
      - "8501:8501"
    depends_on:
      - api
